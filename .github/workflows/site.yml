# Builds and deploys this rare-disease-reconciliator instance to GitHub Pages.
# - On push: snapshot any seed in site.config.json that has no snapshot yet (and drop removed ones), then deploy.
# - Weekly and on manual dispatch: re-harvest every seed, then deploy.
# Optional repository secret OPENALEX_API_KEY raises OpenAlex's anonymous rate limit for snapshot runs.
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-harvest all snapshots before deploying"
        type: boolean
        default: true

permissions:
  contents: write   # commit refreshed snapshots
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Snapshots
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" -a "${{ inputs.refresh }}" = "true" ]; then
            npm run snapshot
          else
            npm run snapshot -- --missing
          fi
        continue-on-error: true   # a source being down should not block deploying what we have

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then git commit -m "Update snapshots" && git push; fi

      - name: Build Comunica bundle
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html site.config.json README.md LICENSE src queries data vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
